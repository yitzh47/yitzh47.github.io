# One-click deploy on Render: dashboard.render.com → New → Blueprint → pick this repo.
services:
  - type: web
    name: vape-store
    runtime: docker
    plan: starter            # a persistent disk (for the SQLite database) needs a paid plan
    healthCheckPath: /
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_URL         # e.g. https://vape-store.onrender.com (fill in after first deploy)
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Test mode: fake payments. Switch to authorizenet + keys before taking real orders.
      - key: PAYMENT_PROVIDER
        value: demo
      - key: ALLOW_DEMO_PAYMENTS
        value: "true"
